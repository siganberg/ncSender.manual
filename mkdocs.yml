site_name: ncSender Documentation
site_description: User manual and documentation for ncSender CNC controller software
site_url: https://docs.ncsender.com
repo_url: https://github.com/siganberg/ncSender
repo_name: siganberg/ncSender

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  # Click any image in the docs to zoom in — helpful when a screenshot
  # bundles a wide UI + a small annotation. Uses GLightbox under the hood.
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - License Activation: getting-started/license-activation.md
    - First Connection: getting-started/first-connection.md
    - Interface Overview: getting-started/interface-overview.md
    - Software Updates: getting-started/software-updates.md
  - Features:
    - Visualizer: features/visualizer.md
    - Jog Controls: features/jog-controls.md
    - DRO: features/dro.md
    - Probing: features/probing.md
    - Tool Management: features/tool-management.md
    - Macros: features/macros.md
    - Console & Terminal: features/console.md
    - G-Code Preview: features/gcode-preview.md
    - Program Events: features/program-events.md
    - Laser Mode: features/laser-mode.md
    - Multi-Workspace: features/multi-workspace.md
    - 4th Axis: features/4th-axis.md
    - Trace: features/trace.md
    - Virtual Keyboard: features/virtual-keyboard.md
    - Safety Door: features/safety-door.md
  - Accessories:
    - Wireless USB: accessories/wireless-usb.md
    - Pendant: accessories/pendant.md
    - AutoDustBoot: accessories/autodustboot.md
    - Smart RGB LED: accessories/smart-rgb-led.md
  - Plugins:
    - Overview: plugins/overview.md
    - Edge Align: plugins/edge-align.md
    - 3DMesh: plugins/3dmesh.md
    - QuickCut: plugins/quickcut.md
    - ToolBench: plugins/toolbench.md
    - Rapid Change ATC: plugins/rapid-change-atc.md
    - Manual Tool Changer: plugins/manual-tool-changer.md
    - Replicator: plugins/replicator.md
    - BoxJoints: plugins/boxjoints.md
  - Controller Setup:
    - grblHAL: controllers/grblhal.md
    - FluidNC: controllers/fluidnc.md
  - Resources:
    - Overview: resources/index.md
    - VFD Setup (RS485/ModBus): resources/vfd-setup.md
  - FAQ: faq.md
  - Troubleshooting: troubleshooting.md
  - Utilities:
    - Wireless USB Flasher: utility/wireless-usb-flasher.md

dev_addr: '127.0.0.1:8001'

extra_css:
  - assets/css/custom.css

extra_javascript:
  - assets/js/source-stats.js
  - assets/js/pro-badge.js
  - assets/js/soon-badge.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/siganberg/ncSender
    - icon: fontawesome/brands/discord
      link: https://discord.gg/3U5Jx2q2wZ
