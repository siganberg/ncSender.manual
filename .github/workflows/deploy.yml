name: Deploy Documentation

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let in-progress deploys finish rather than
# cancelling them mid-flight (cancelling mid-deploy can leave a duplicate
# github-pages artifact and fail the next run).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install mkdocs-material mkdocs-glightbox

      - run: mkdocs build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub's Pages build queue can sit in "deployment_queued" for a
          # while; the default 10-min poll gives up before it drains even
          # though the deployment finishes server-side. Wait up to 30 min so
          # the run reports the real outcome instead of a false timeout.
          timeout: 1800000
